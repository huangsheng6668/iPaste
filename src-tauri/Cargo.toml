[package]
name = "ipaste"
version = "0.9.5"
description = "A local-first tray clipboard manager for macOS and Windows."
authors = ["iPaste Contributors"]
license = "Apache-2.0"
edition = "2021"
# tauri build 需要在多 bin 场景下指明主程序（另一个是 mocr_engine sidecar）
default-run = "ipaste"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ipaste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Manga-OCR ONNX 推理 sidecar：独立链接（onnxruntime 的 /MD CRT 与主程序内
# mnn（ocr-rs）的 /MT 假设冲突，进程隔离规避混链）；stdin/stdout 行协议与
# Python 版常驻服务同构，主程序按 sidecar 路径优先调度
[[bin]]
name = "mocr_engine"
path = "src/bin/mocr_engine.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# v5 起应用层帧为明文 JSON，传输加密由 QUIC TLS 承担；aes-gcm/zeroize 仅为
# iroh(noq-proto)/keyring/rustls 等的传递依赖锚点保留，业务代码不再直接使用
aes-gcm = "0.10"
zeroize = "1"
arboard = "3.6.1"
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
enigo = "0.6.1"
getrandom = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "process", "io-util", "time", "macros", "net", "sync"] }
uuid = { version = "1", features = ["v4"] }
xcap = "0.4.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
thiserror = "2"
hostname = "0.4"
# 跨设备同步传输层（iroh，协议 v5）。注意：传递依赖 wmi 已在 Cargo.lock 钉在
# 0.18.1——0.18.4 的 windows/windows-core 版本区间过宽（>=0.59,<0.63），Cargo
# 会解出 0.61.x 与 0.62.x 混搭的不兼容组合导致 wmi 编译失败；0.18.1 两者均
# 锁 ^0.62，勿盲目 `cargo update -p wmi` 升回去。
iroh = "1.0.3"
ts-rs = "12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_DataExchange"] }
# ONNX 推理仅 Windows 编译：onnxruntime 的 /MD CRT 与 mnn 的 /MT 假设只能
# 在进程隔离下共存，且 macOS 的 ort 构建问题解决前不分发 sidecar。
# mocr_engine bin 在非 Windows 编译为占位空壳（见 src/bin/mocr_engine.rs）
ort = "2.0.0-rc.13"

# Apple Silicon 的 ort 必须启用 coreml：ort-sys 预编译分发表中
# aarch64-apple-darwin 仅有 coreml 变体，无 feature 则解析不到分发条目
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["coreml"] }

# macOS 走 Vision 管线，不编译 MNN/bindgen（ocr/paddle.rs 仅非 macOS 编译）
[target.'cfg(not(target_os = "macos"))'.dependencies]
# PaddleOCR 进程内推理（MNN 后端）；版本以 Task 0 Windows 实测钉死
ocr-rs = "=2.4.1"

[dev-dependencies]
http = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSEvent", "NSGraphics", "NSPanel", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "objc2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSGeometry", "NSRange", "NSString", "NSURL", "objc2-core-foundation"] }
