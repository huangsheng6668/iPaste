name: Debug mocr build

# 临时诊断 workflow：macOS 上 mocr_engine 构建失败但日志不可匿名读取。
# 失败时把 cargo stderr 尾部转成 ::error:: 注解（公开可见）。
# 定位并修复后删除本文件。
on:
  push:
    paths:
      - ".github/workflows/debug-mocr-build.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS arm64", os: macos-15 }
          - { name: "macOS x64", os: macos-15-intel }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build mocr_engine (annotations on failure)
        shell: bash
        run: |
          set +e
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin mocr_engine > /tmp/cargo-out.log 2> /tmp/cargo-err.log
          code=$?
          echo "--- stdout tail ---"
          tail -20 /tmp/cargo-out.log
          if [ $code -ne 0 ]; then
            echo "--- surfacing stderr tail as annotations ---"
            tail -80 /tmp/cargo-err.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line" || true
            done
            exit $code
          fi
          echo "BUILD OK"
          ls -la src-tauri/target/release/mocr_engine 2>/dev/null || true
