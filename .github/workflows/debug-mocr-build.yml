name: Debug mocr build

# 临时诊断 workflow v3：macOS 上 tauri build 本体失败（sidecar 已正确跳过）。
# 复刻 release 的构建链（不发版、不签名），失败时把 rustc 错误行转成
# ::error:: 注解（公开可见）。定位并修复后删除本文件。
on:
  push:
    paths:
      - ".github/workflows/debug-mocr-build.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS arm64", os: macos-15, target: aarch64-apple-darwin }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: tauri build (no bundle, annotations on failure)
        shell: bash
        run: |
          set +e
          npx tauri build --target ${{ matrix.target }} --no-bundle > /tmp/build-out.log 2> /tmp/build-err.log
          code=$?
          echo "--- stdout tail ---"
          tail -30 /tmp/build-out.log
          echo "--- stderr first errors ---"
          head -40 /tmp/build-err.log
          if [ $code -ne 0 ]; then
            echo "--- rustc error lines as annotations ---"
            grep -nE "error(\[E[0-9]+\])?:|panicked at|cannot find|unresolved|linking with" /tmp/build-err.log | tail -50 | while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::${line:0:600}"; fi
            done
            exit $code
          fi
          echo "BUILD OK"
