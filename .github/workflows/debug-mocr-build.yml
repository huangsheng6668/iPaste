name: Debug mocr build

# 临时诊断（Phase 0）：验证 aarch64+coreml 在 macOS 的链接与测试。
# 通过/失败结论拿到后由 Task 5 删除本文件。
on:
  push:
    paths:
      - ".github/workflows/debug-mocr-build.yml"
      - "src-tauri/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS arm64", os: macos-15, target: aarch64-apple-darwin }
          - { name: "macOS x64", os: macos-15-intel, target: x86_64-apple-darwin }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cargo build mocr_engine
        shell: bash
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin mocr_engine
          echo "BUILD OK"
      - name: cargo test export_bindings (diagnostic)
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml export_bindings > /tmp/test_out.log 2>&1
          code=$?
          cat /tmp/test_out.log
          if [ $code -ne 0 ]; then
            grep -nE "error(\[E[0-9]+\])?:|panicked at|cannot find|unresolved|linking with|FAILED|assertion" /tmp/test_out.log | tail -50 | while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::${line:0:600}"; fi
            done
            exit $code
          fi
          echo "TEST OK"