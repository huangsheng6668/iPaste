name: Finalize release

# 修复已发布 release 的 latest.json（例如某平台 job 因网络失败、清单里缺平台，
# 或旧版本清单被并发的矩阵 job 写残缺）。只重建清单并把 release 置为 latest，
# 不重新构建任何产物。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（例如 iPaste-v1.11.2）"
        required: true
        type: string

jobs:
  finalize:
    name: Rebuild updater manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild latest.json and republish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/finalize-release.mjs
