name: Debug macOS signing

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Import certificate and test codesign with timeouts
        shell: bash
        env:
          IPASTE_MACOS_SIGNING_CERT: ${{ secrets.IPASTE_MACOS_SIGNING_CERT }}
          IPASTE_MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.IPASTE_MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -x
          CERT_FILE="$(mktemp -d)/cert.p12"
          KEYCHAIN="ipaste-build.keychain-db"
          echo "$IPASTE_MACOS_SIGNING_CERT" | base64 --decode > "$CERT_FILE"
          security create-keychain -p "$IPASTE_MACOS_SIGNING_CERT_PASSWORD" "$KEYCHAIN"
          security list-keychains -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$IPASTE_MACOS_SIGNING_CERT_PASSWORD" "$KEYCHAIN"
          security import "$CERT_FILE" -k "$KEYCHAIN" -P "$IPASTE_MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$IPASTE_MACOS_SIGNING_CERT_PASSWORD" "$KEYCHAIN"
          echo "--- identities:"
          security find-identity -v "$KEYCHAIN" || true
          echo "--- search list:"
          security list-keychains

          echo 'int main(){return 0;}' > t.c && cc t.c -o t
          cat > ent.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict/></plist>
          EOF

          run_cs() {
            DESC="$1"; shift
            echo "--- variant: $DESC"
            "$@" & CS_PID=$!
            ( sleep 45; kill -9 $CS_PID 2>/dev/null ) & WD_PID=$!
            wait $CS_PID; RC=$?
            kill $WD_PID 2>/dev/null
            echo "[$DESC] rc=$RC"
            if [ $RC -ge 128 ]; then echo "[$DESC] HUNG"; fi
          }

          run_cs "plain" codesign -fs "iPaste Distribution" t
          run_cs "identifier" codesign --force --identifier com.ipaste.desktop --sign "iPaste Distribution" t
          run_cs "runtime" codesign --force --sign "iPaste Distribution" --options runtime t
          run_cs "entitlements" codesign --force --sign "iPaste Distribution" --entitlements ent.plist t
          run_cs "full" codesign --force --identifier com.ipaste.desktop --sign "iPaste Distribution" --entitlements ent.plist --options runtime t
          echo "=== done ==="
