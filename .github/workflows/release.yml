name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            rustTargets: x86_64-pc-windows-msvc
            args: ""
          - name: macOS Apple Silicon
            platform: macos-15
            rustTargets: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-15-intel
            rustTargets: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Install LLVM (libclang for bindgen)
        if: runner.os == 'Windows'
        run: choco install llvm -y --no-progress

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure updater endpoints
        env:
          IPASTE_UPDATER_R2_ENDPOINT: ${{ secrets.IPASTE_UPDATER_R2_ENDPOINT }}
          IPASTE_OCR_R2_BASE_URL: ${{ secrets.IPASTE_OCR_R2_BASE_URL }}
        run: node scripts/configure-updater-endpoints.mjs

      # 独立构建 sidecar：失败在此步骤直接暴露 cargo 原始输出（嵌在
      # beforeBuildCommand 里会被 tauri-action 聚合为单一退出码），并带
      # 网络重试（ort 的 onnxruntime 预编译包冷下载偶发抖动）。
      # Windows 与 macOS Apple Silicon (ARM64) 构建真实 sidecar；Intel Mac 跳过（打包占位）。
      - name: Build mocr_engine sidecar (explicit, with retries)
        if: runner.os == 'Windows' || (runner.os == 'macOS' && runner.arch == 'ARM64')
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::mocr_engine build attempt $attempt"
            if npm run build:mocr-engine; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "mocr_engine build failed after 3 attempts"
          exit 1

      # 导入自签名 macOS 签名证书：建立稳定代码身份，使 TCC 权限
      # （辅助功能/屏幕录制）在版本升级后依然有效，用户无需反复重新授权。
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          IPASTE_MACOS_SIGNING_CERT: ${{ secrets.IPASTE_MACOS_SIGNING_CERT }}
          IPASTE_MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.IPASTE_MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          CERT_FILE="$(mktemp -d)/cert.p12"
          KEYCHAIN="ipaste-build.keychain-db"
          echo "$IPASTE_MACOS_SIGNING_CERT" | base64 --decode > "$CERT_FILE"
          security create-keychain -p "$IPASTE_MACOS_SIGNING_CERT_PASSWORD" "$KEYCHAIN"
          # Rust 编译耗时较长：清除锁定超时与休眠锁定，否则签名时 keychain
          # 已自动锁定，codesign 在无头环境死等解锁弹窗（实测挂起）。
          security set-keychain-settings "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$IPASTE_MACOS_SIGNING_CERT_PASSWORD" "$KEYCHAIN"
          security import "$CERT_FILE" -k "$KEYCHAIN" -P "$IPASTE_MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$IPASTE_MACOS_SIGNING_CERT_PASSWORD" "$KEYCHAIN"
          security find-identity -v "$KEYCHAIN"

      - name: Build and publish Tauri app
        id: tauri-build
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: iPaste Distribution
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          releaseCommitish: main
          tagName: iPaste-v__VERSION__
          releaseName: iPaste v__VERSION__
          releaseBody: |
            ## macOS 首次安装提示

            iPaste 的 macOS 安装包目前未经 Apple 公证，从浏览器下载后可能被 Gatekeeper 拦截并提示「已损坏，无法打开」。这不是文件损坏，可正常使用。

            一键安装脚本（自动安装并清除隔离标记）：

            ```bash
            bash <(curl -fsSL https://github.com/huangsheng6668/iPaste/releases/latest/download/install-macos.sh)
            ```

            或手动清除隔离标记：`xattr -dr com.apple.quarantine /Applications/iPaste.app`

            已安装的用户建议使用应用内的「检查更新」，更新包不受 Gatekeeper 限制。

            ## macOS 权限提示

            截图识别文字需要「屏幕录制」权限（与「辅助功能」是两个不同的权限），请在 系统设置 → 隐私与安全性 中开启，并完全重启 iPaste。

            升级 iPaste 后若提示权限未授权，请在对应权限列表中先移除 iPaste 再重新添加并开启（未签名版本每次更新身份都会变化），然后重启应用。
          releaseDraft: false
          prerelease: false
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          retryAttempts: 2
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify macOS updater artifacts
        if: startsWith(matrix.name, 'macOS')
        shell: bash
        run: |
          artifact_paths='${{ steps.tauri-build.outputs.artifactPaths }}'
          echo "$artifact_paths" | jq -e 'any(.[]; test("\\.app\\.tar\\.gz\\.sig$"))' >/dev/null

      - name: Upload install script to release
        if: matrix.name == 'macOS Apple Silicon'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release upload "iPaste-v${version}" scripts/install-macos.sh --clobber

  mirror-r2:
    name: Mirror release to Cloudflare R2
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    env:
      IPASTE_UPDATER_R2_ENDPOINT: ${{ secrets.IPASTE_UPDATER_R2_ENDPOINT }}
      IPASTE_OCR_R2_BASE_URL: ${{ secrets.IPASTE_OCR_R2_BASE_URL }}

    steps:
      - name: Checkout
        if: env.IPASTE_UPDATER_R2_ENDPOINT != ''
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.IPASTE_UPDATER_R2_ENDPOINT != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release tag
        if: env.IPASTE_UPDATER_R2_ENDPOINT != ''
        id: release-tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=iPaste-v${version}" >> "$GITHUB_OUTPUT"

      - name: Download GitHub release assets
        if: env.IPASTE_UPDATER_R2_ENDPOINT != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/r2-release
          gh release download "${{ steps.release-tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist/r2-release \
            --clobber

      - name: Upload updater assets to R2
        if: env.IPASTE_UPDATER_R2_ENDPOINT != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_KEEP_RELEASES: 3
        run: node scripts/mirror-r2-release.mjs
