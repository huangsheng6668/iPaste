name: Publish OCR assets

# 发布/刷新 Windows OCR v2 资产（PP-OCRv5 .mnn 模型 + 安装器 v2 manifest）：
# 1. 重建 staging（prepare-staging.mjs，sha256 门禁）
# 2. 生成 manifest（baseUrl = GitHub Pages 的 ocr/ 目录）
# 3. 强推专用分支 ocr-assets（Pages 来源，布局 ocr/paddle/{mode}/…）
# 4. 确保 Pages 已启用 + 创建 GitHub Release ipaste-ocr-windows-v2（清单兜底 + 归档）
# 5. 只读验证（Pages URL 可达 + 模型哈希一致）
# 零 secrets（全部走 GITHUB_TOKEN）；幂等可重跑；绝不触碰 v1 资产。
# 手册：scripts/ocr-models/README.md §4。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ocr-models/**"
      - ".github/workflows/publish-ocr-assets.yml"

permissions:
  contents: write
  pages: write

jobs:
  publish:
    name: Publish paddle OCR assets
    runs-on: ubuntu-latest
    env:
      STAGING: ocr-spike/staging
      RELEASE_TAG: ipaste-ocr-windows-v2
      ASSETS_BRANCH: ocr-assets
      # 项目 Pages 域名（仓库页面 Settings → Pages 所示地址）
      OCR_BASE_URL: https://huangsheng6668.github.io/iPaste/ocr/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare staging (sha256-gated)
        run: node scripts/ocr-models/prepare-staging.mjs --out "$STAGING"

      - name: Build manifests with Pages base URL
        run: |
          for mode in fast best; do
            node scripts/ocr-models/build-manifest.mjs --dir "$STAGING" --mode "$mode" \
              --base-url "$OCR_BASE_URL" --engine-version 2.0.0 \
              --out "$STAGING/manifests/ipaste-ocr-windows-x64-$mode.json"
          done

      - name: Publish assets branch for GitHub Pages
        run: |
          # orphan 分支整树重写：资产由 sha256 钉死，无需历史
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$ASSETS_BRANCH"
          git rm -rf --quiet .
          mkdir -p ocr
          cp -r "$STAGING/paddle" ocr/
          cp "$STAGING/manifests/ipaste-ocr-windows-x64-fast.json" \
             "$STAGING/manifests/ipaste-ocr-windows-x64-best.json" ocr/
          printf 'iPaste OCR v2 assets (paddle PP-OCRv5). Served via GitHub Pages. Do not edit.\n' > README.md
          # 显式只加目标路径：git rm 已删掉 .gitignore，git add . 会把
          # 未跟踪的 ocr-spike/ 临时目录一并提交（重复 32MB）
          git add ocr README.md
          git commit -m "publish: paddle ocr v2 assets [skip ci]"
          git push --force origin "$ASSETS_BRANCH"

      - name: Ensure GitHub Pages enabled (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN 在部分仓库无权新建 Pages 站点（403）；已启用则直接通过，
          # 未启用且建站失败则报错（此时需仓库管理员手动开一次 Pages）
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "200" ]; then echo "pages already enabled"; exit 0; fi
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -d "{\"source\":{\"branch\":\"$ASSETS_BRANCH\",\"path\":\"/\"}}")
          echo "enable pages -> HTTP $code"
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            cat /tmp/pages.json
            curl -s -o /tmp/pages2.json -w "recheck -> %{http_code}\n" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            [ "$(cat /tmp/pages2.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status") is not None)' 2>/dev/null)" = "True" ] || exit 1
          fi

      - name: Create or refresh GitHub release (manifest fallback + archival copies)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIST="$(mktemp -d)"
          cp "$STAGING/manifests/ipaste-ocr-windows-x64-fast.json" "$STAGING/manifests/ipaste-ocr-windows-x64-best.json" "$DIST/"
          for mode in fast best; do
            cp "$STAGING/paddle/$mode/det.mnn"           "$DIST/paddle-$mode-det.mnn"
            cp "$STAGING/paddle/$mode/rec.mnn"           "$DIST/paddle-$mode-rec.mnn"
            cp "$STAGING/paddle/$mode/ppocr_keys_v5.txt" "$DIST/paddle-$mode-ppocr_keys_v5.txt"
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DIST"/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$DIST"/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "iPaste OCR engine assets v2 (paddle)" \
              --notes "PP-OCRv5 mobile MNN models (fast=fp16, best=fp32) + charset + installer v2 manifests. Source: rust-paddle-ocr @ 2d0a7e5, Apache-2.0; models: PaddleOCR, Apache-2.0. Manifest baseUrl points at GitHub Pages; flattened model copies here are archival."
          fi

      - name: Verify published assets (Pages builds may lag; retry)
        run: |
          set -e
          fetch() { curl -fsSL --retry 20 --retry-delay 10 --retry-all-errors "$1"; }
          for mode in fast best; do
            manifest="$STAGING/manifests/ipaste-ocr-windows-x64-$mode.json"
            base="$(node -e 'const m=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));console.log(m.engine.baseUrl)' "$manifest")"
            for entry in $(node -e 'const m=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));for(const f of m.engine.files)console.log(`${f.path}|${f.sha256}`)' "$manifest"); do
              rel="${entry%%|*}"; expected="${entry#*|}"
              actual="$(fetch "$base$rel" | sha256sum | cut -d" " -f1)"
              [ "$actual" = "$expected" ] || { echo "FAIL $base$rel"; exit 1; }
              echo "OK   $base$rel"
            done
            fetch "$base/ipaste-ocr-windows-x64-$mode.json" >/dev/null && echo "OK   pages $mode manifest"
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/ipaste-ocr-windows-x64-$mode.json" >/dev/null \
              && echo "OK   github $mode manifest"
          done
